name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and verify release package
        shell: powershell
        run: .\scripts\build-release.ps1

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: SystemGuardian-Windows
          path: Release/SystemGuardian-v*.zip
